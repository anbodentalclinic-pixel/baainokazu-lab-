<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="場合の数ラボ">
<meta name="theme-color" content="#1f3a5f">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>場合の数ラボ</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2733;--sub:#5d6875;--line:#d9d4c8;--main:#1f3a5f;--acc:#c8553d;--ok:#2e7d5b;--okbg:#e3f3ea;--ng:#b3402e;--ngbg:#fbe6e1;--chip:#eef2f7;--hl:#fff3c4}
@media (prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1b232c;--ink:#e8edf2;--sub:#9aa7b4;--line:#2f3a46;--main:#8fb8ea;--acc:#f08a70;--ok:#6fcf9f;--okbg:#17352a;--ng:#f08a70;--ngbg:#3a1f1a;--chip:#26313c;--hl:#4a4014}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.65;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:14px 16px 8px;max-width:640px;margin:0 auto}
header h1{font-size:19px;margin:0;color:var(--main);letter-spacing:.04em}
header p{margin:2px 0 0;font-size:12px;color:var(--sub)}
main{max-width:640px;margin:0 auto;padding:0 12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--sub);font-size:11px;padding:10px 0 9px;font-family:inherit}
nav button b{display:block;font-size:17px;font-weight:700}
nav button.on{color:var(--main);box-shadow:inset 0 3px 0 var(--main)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 6px;color:var(--main)}
.card h3{font-size:14px;margin:12px 0 4px}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.btn{font-family:inherit;font-size:15px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:9px 14px;min-height:44px}
button.btn.pri{background:var(--main);color:var(--card);border-color:var(--main);font-weight:700}
button.btn.sm{font-size:13px;padding:6px 10px;min-height:36px}
button.btn:disabled{opacity:.35}
.item{display:block;width:100%;text-align:left;font-family:inherit;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink)}
.item .tag{display:inline-block;font-size:11px;background:var(--chip);color:var(--main);border-radius:6px;padding:1px 7px;margin-right:6px}
.item .done{float:right;color:var(--ok);font-weight:700}
.back{border:0;background:none;color:var(--main);font-size:14px;padding:10px 2px;font-family:inherit}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:22px;border:2px solid transparent;font-weight:700;font-size:17px;color:#fff;font-family:inherit}
.chip.off{opacity:.2}
.slot{display:inline-flex;align-items:center;justify-content:center;width:48px;height:52px;border:2px dashed var(--line);border-radius:10px;font-weight:700;font-size:18px;color:#fff}
.slot.now{border-color:var(--acc);border-style:solid}
.big{font-size:22px;font-weight:700;color:var(--main);margin:8px 0;word-break:break-all}
.say{background:var(--hl);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.why{background:var(--okbg);border-left:4px solid var(--ok);border-radius:6px;padding:8px 10px;margin:8px 0;font-size:14px}
.opt{display:block;width:100%;text-align:left;font-family:inherit;font-size:15px;line-height:1.5;background:var(--chip);border:2px solid transparent;border-radius:10px;padding:10px 12px;margin:6px 0;color:var(--ink);min-height:44px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ng{background:var(--ngbg);border-color:var(--ng);opacity:.7}
.stepn{font-size:12px;font-weight:700;color:var(--acc);margin-top:14px}
.bund{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);border-radius:8px;padding:5px;margin:5px 0;align-items:center}
.bund .k{font-size:12px;font-weight:700;color:var(--main);min-width:48px}
.tok{font-size:13px;background:var(--chip);border-radius:6px;padding:2px 6px;font-family:ui-monospace,Menlo,monospace}
.tok.v{background:var(--hl);font-weight:700}
.flat{display:flex;flex-wrap:wrap;gap:4px}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.cell{width:38px;height:46px;border-radius:8px;border:1px solid var(--line);background:var(--chip);font-size:20px;font-family:inherit;color:var(--ink)}
.cell.bar{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}

.kslot{flex:1;min-width:56px;font-family:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 2px;text-align:center;min-height:58px}
.kslot span{display:block;font-size:10px;color:var(--sub)}.kslot b{font-size:18px}
.kslot.sel{border-color:var(--acc);background:var(--hl)}.kslot.fix{background:var(--chip);border-style:dashed}
.br{display:flex;align-items:center;gap:8px;width:100%;font-family:inherit;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:5px 0;color:var(--ink);min-height:44px}
.br b{min-width:34px;font-size:17px}.br i{display:block;height:14px;border-radius:7px;background:var(--main);flex:none}.br:disabled{opacity:.4}
.br em{font-style:normal;color:var(--sub);font-size:13px;margin-left:auto;white-space:nowrap}
@keyframes kdraw{to{stroke-dashoffset:0}}@keyframes kcalm{to{stroke:var(--sub)}}@keyframes kfadein{to{opacity:1}}
@keyframes kpopin{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.7);color:var(--acc)}100%{opacity:1;transform:scale(1)}}
@keyframes ksw{0%{opacity:.55;transform:translateY(0)}95%{opacity:.55}100%{opacity:0;transform:translateY(var(--d))}}
.kline{animation:kdraw .35s ease-out forwards,kcalm .6s forwards}.kfade{opacity:0;animation:kfadein .3s forwards}
.kpop{display:inline-block;opacity:0;animation:kpopin .6s forwards}.ksweep{opacity:0;animation:ksw 1.4s linear forwards}
@media (prefers-reduced-motion:reduce){.kline{animation:none;stroke-dashoffset:0!important;stroke:var(--sub)}.kfade,.kpop{animation:none;opacity:1}.ksweep{animation:none}}
@keyframes fxin{from{opacity:0;transform:translateY(10px)}}@keyframes fxshake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes fxpulse{0%{transform:scale(.92)}45%{transform:scale(1.06);box-shadow:0 0 0 6px rgba(200,85,61,.25)}100%{transform:scale(1)}}
@keyframes fxtok{0%{transform:scale(2.4);background:var(--acc);color:#fff}70%{background:var(--acc);color:#fff}}
@keyframes fxrot{from{transform:rotate(90deg)}}@keyframes fxflip{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes fxband{to{opacity:.24}}
.fxin{animation:fxin .3s ease-out both}.fxshake{animation:fxshake .4s}.fxpulse{animation:fxpulse .5s ease-out}
.tok{display:inline-block}.tok.fxnew{animation:fxtok .7s ease-out}.fxrot{animation:fxrot .55s ease-in-out}.fxflip{animation:fxflip .6s ease-in-out}
.kdraw2{animation:kdraw .3s ease-out forwards}.kband{opacity:0;animation:fxband .5s forwards}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
@media (prefers-reduced-motion:reduce){.fxin,.fxshake,.fxpulse,.tok.fxnew,.fxrot,.fxflip{animation:none}.kdraw2{animation:none;stroke-dashoffset:0!important}.kband{animation:none;opacity:.24}}
@keyframes fbw{to{transform:scaleX(1)}}
.frow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;margin:10px 0;font-weight:700;font-size:17px}
.fg{display:inline-flex;flex-direction:column;align-items:center}.fb{display:block;width:100%;height:8px;border:2px solid var(--acc);border-top:0;border-radius:0 0 8px 8px;margin-top:2px}
.fbA{transform:scaleX(0);animation:fbw .45s ease-out forwards}.fl{color:var(--acc);font-size:17px}
.frac{margin-top:12px;padding:10px 12px;border:2px dashed var(--line);border-radius:12px}
.fr1,.fr2{display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.4}.fr1>b,.fr2>b{min-width:66px;text-align:center;font-size:22px;border-radius:8px;padding:3px 6px}
.fr1>b{background:var(--chip)}.fr2>b{background:var(--hl)}.frbar{height:3px;background:var(--ink);width:66px;margin:6px 0;transform-origin:left}
.frac small{color:var(--sub)}.fres{margin-top:8px;font-size:17px}.fres .acc{color:var(--acc);font-size:20px}
@media (prefers-reduced-motion:reduce){.fbA{animation:none;transform:none}}
@keyframes fxgc{to{background:var(--gc);color:#1d2733}}
.tok.gc{background:var(--gc);color:#1d2733}.tok.gcA{animation:fxgc .35s forwards}
.bchip{display:inline-flex;flex-direction:column;align-items:center;border-radius:8px;padding:3px 8px;font-weight:700;font-size:13px;color:#1d2733;font-family:ui-monospace,Menlo,monospace}
.bchip small{font-weight:400;font-size:10px}
.mini{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:1px;background:var(--chip);border-radius:6px;padding:3px 6px;display:inline-block;margin:2px 0}
@media (prefers-reduced-motion:reduce){.tok.gcA{animation:none;background:var(--gc);color:#1d2733}}
.scene{border:1px solid var(--line);border-radius:12px;padding:8px 6px;margin:8px 0;background:var(--bg)}
.srow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center;margin:5px 0}
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 4px;border-radius:15px;font-weight:700;font-size:13px;color:#fff;background:var(--main)}.sc.off{opacity:.22}
.sbx{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:40px;min-height:44px;padding:2px 4px;border:2px solid var(--line);border-radius:8px;background:var(--card);font-size:16px;text-align:center}
.sbx small{font-size:9px;color:var(--sub);line-height:1.2}.sbx.on{border-color:var(--acc);background:var(--hl)}
.sgap{color:var(--sub);font-size:11px;text-align:center;line-height:1.2}.sblk{display:inline-flex;gap:4px;border:2px solid var(--acc);border-radius:12px;padding:3px 5px;align-items:center}
.sgrp{display:inline-flex;flex-direction:column;align-items:center;border:2px solid var(--line);border-radius:10px;padding:4px 6px;min-width:60px;min-height:52px;background:var(--card)}.sgrp>small{font-size:10px;color:var(--sub)}
svg{max-width:100%;height:auto;display:block;margin:6px auto}
select{font-family:inherit;font-size:15px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;min-height:44px}
.score{font-size:13px;color:var(--sub);text-align:right}
</style>
</head>
<body>
<header><h1>場合の数ラボ</h1><p>式は覚えるものではなく、数えた結果として最後にできるもの。</p></header>
<main id="app"></main>
<nav>
<button data-tab="cnt"><b>数える</b>樹形図を描く</button>
<button data-tab="lab"><b>重なり</b>同じものを作る</button>
<button data-tab="drill"><b>確認</b>問題集の問題</button>
<button data-tab="quiz"><b>初見</b>答えまで進む</button>
</nav>
<script>
"use strict";
/* ---------- 共通 ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const COL=['#c8553d','#2f6fb0','#2e7d5b','#b07d1a','#7b4fa3','#3c8c94'];
const NAME='ABCDEF';
const store={get(k,d){try{const v=localStorage.getItem('bk_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('bk_'+k,JSON.stringify(v))}catch(e){}}};
let FX={};
const S={tab:'cnt',lab:null,drill:null,done:store.get('done',{}),quiz:null,qs:store.get('qs',{n:0,ok:0})};
const fact=n=>n<2?1:n*fact(n-1);
const P=(n,r)=>{let x=1;for(let i=0;i<r;i++)x*=n-i;return x};
const C=(n,r)=>P(n,r)/fact(r);
const SUB='₀₁₂₃₄₅₆₇₈₉';const sub=n=>String(n).split('').map(c=>SUB[+c]).join('');
function permsR(a,r){if(r===0)return[[]];const o=[];a.forEach((x,i)=>{const rest=a.slice(0,i).concat(a.slice(i+1));permsR(rest,r-1).forEach(p=>o.push([x].concat(p)))});return o}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- ラボ ---------- */
const LABS=[
{id:'bund',t:'同じものを、自分の手で作る',d:'回す・入れかえる・名前を付けかえる。何個が重なるかを動かして確かめる'},
{id:'path',t:'最短経路を数える',d:'なぜ矢印の並べ方で数えるのか、から始める'},
{id:'bars',t:'重複組合せ = ○と仕切りの並べ方(118頁)',d:'仕切りを置く場所を選ぶだけ'}
];
const L={perm:{n:5,r:3,ch:[]},bund:{i:0,g:false},path:{w:4,h:3,m:[],q73:false,intro:true},bars:{b:[],min1:false}};

function labMenu(){
 return `<div class="card"><h2>重なりと置き換え</h2><div class="sub">割り算が出てくるのは、同じものを何回も数えているとき。何回数えたかは、1つを自分で動かしてみれば分かる。<br>道や分け方の問題は、別のものの並べ方に置き換えて数える。</div></div>`+
 LABS.map(l=>`<button class="item" data-lab="${l.id}"><b>${l.t}</b><br><span class="sub">${l.d}</span></button>`).join('');
}
function labPerm(){
 const s=L.perm,k=s.ch.length,left=s.n-k,doneAll=k===s.r;
 const chips=[...Array(s.n).keys()].map(i=>`<button class="chip ${s.ch.includes(i)?'off':''}" style="background:${COL[i]}" data-pick="${i}" ${s.ch.includes(i)||doneAll?'disabled':''}>${NAME[i]}</button>`).join('');
 const slots=[...Array(s.r).keys()].map(i=>i<k?`<span class="slot" style="background:${COL[s.ch[i]]};border-style:solid;border-color:transparent">${NAME[s.ch[i]]}</span>`:`<span class="slot ${i===k?'now':''}"></span>`).join('');
 const nums=[...Array(k).keys()].map(i=>s.n-i);
 let say;
 if(doneAll)say=`できた式:<b>${nums.join(' × ')} = ${P(s.n,s.r)}</b>(= ${sub(s.n)}P${sub(s.r)})<br>だれを選んでも「残りの人数」は同じだった。だから掛け算で数えられる。`;
 else say=`${k+1}番目の席:いま選べるのは <b>${left}人</b>(下で色がついている人を数える)<br>→ だからここに「<b>${left}</b>」と書ける。1人タップして座らせよう。`;
 return back('lab')+`<div class="card"><h2>${s.n}人から${s.r}人を選んで1列に並べる</h2>
 <div class="row">${slots}</div>
 <div class="big">${nums.length?nums.join(' × ')+(doneAll?' = '+P(s.n,s.r):' × ?'):'?'}</div>
 <div class="say">${say}</div>
 <div class="row">${chips}</div>
 <h3>人数を変えて試す</h3>
 <div class="row"><button class="btn sm" data-pn="-1">人数−</button><span>${s.n}人</span><button class="btn sm" data-pn="1">人数＋</button>
 <button class="btn sm" data-pr="-1">席−</button><span>${s.r}席</span><button class="btn sm" data-pr="1">席＋</button>
 <button class="btn sm pri" data-preset="1">やり直す</button></div></div>
 <div class="card"><h3>条件つきでも同じ</h3><div class="sub">「運転席は免許のある3人だけ」なら、運転席で色がついているのは3人 → 3 と書く。条件のきつい席から決めるのは、後回しにすると「残っている人数」が場合によって変わり、数字が1つに決まらなくなるから。</div></div>`;
}
const circKey=s=>{const i=s.indexOf('A');return s.slice(i)+s.slice(0,i)};
const BP=[
{n:'4人から2人を選ぶ(組合せ)',make:()=>permsR([...'ABCD'],2).map(p=>p.join('')),key:s=>[...s].sort().join(''),
 f:'₄P₂ ÷ 2! = 12 ÷ 2 = 6 = ₄C₂',w:'選ぶだけなら AB と BA は同じ。選んだ2人の並べ方は 2! = 2 通りあるので、どの束もちょうど2個。'},
{n:'5人から3人を選ぶ(組合せ)',make:()=>permsR([...'ABCDE'],3).map(p=>p.join('')),key:s=>[...s].sort().join(''),
 f:'₅P₃ ÷ 3! = 60 ÷ 6 = 10 = ₅C₃',w:'選んだ3人の並べ方は 3! = 6 通り。どの束もちょうど6個だから、6で割れば束の数になる。'},
{n:'a, a, b, c を1列に並べる(同じ文字)',make:()=>permsR(['a₁','a₂','b','c'],4).map(p=>p.join('')),key:s=>s.replace(/[₁₂₃]/g,''),
 f:'4! ÷ 2! = 24 ÷ 2 = 12',w:'a に番号をつけて区別すると 4! 通り。番号を消すと a₁a₂ と a₂a₁ の入れ替え(2! 通り)が同じ並びになる。'},
{n:'a, a, a, b を1列に並べる(同じ文字)',make:()=>permsR(['a₁','a₂','a₃','b'],4).map(p=>p.join('')),key:s=>s.replace(/[₁₂₃]/g,''),
 f:'4! ÷ 3! = 24 ÷ 6 = 4',w:'3個の a の入れ替えは 3! = 6 通り。番号を消すと6個が1つに重なる。'},
{n:'a, a, b, b を1列に並べる(同じ文字が2種類)',make:()=>permsR(['a₁','a₂','b₁','b₂'],4).map(p=>p.join('')),key:s=>s.replace(/[₁₂₃]/g,''),
 f:'4! ÷ (2! × 2!) = 24 ÷ 4 = 6',w:'a の入れ替え 2! 通り × b の入れ替え 2! 通り = 4個が1つに重なる。'},
{n:'4人が円卓に座る(円順列)',make:()=>permsR([...'ABCD'],4).map(p=>p.join('')),key:circKey,
 f:'4! ÷ 4 = 6 = (4−1)!',w:'1列に書いた ABCD, BCDA, CDAB, DABC は、円にすると回しただけで同じ。回し方は人数と同じ4通り。A を固定して残り3人を並べる、と考えても同じ 3! になる。'},
{n:'4色の玉で首飾りを作る(じゅず順列)',make:()=>permsR([...'ABCD'],4).map(p=>p.join('')),key:s=>{const r=circKey(s),v='A'+[...r.slice(1)].reverse().join('');return r<v?r:v},
 f:'4! ÷ 4 ÷ 2 = 3',w:'回して同じ(4通り)に加えて、裏返して同じ(2通り)。1束は 4×2 = 8個。'},
{n:'4人を2人ずつ2組に分ける(組分け)',make:()=>[['AB','CD'],['AC','BD'],['AD','BC'],['BC','AD'],['BD','AC'],['CD','AB']].map(x=>'A室'+x[0]+'・B室'+x[1]),key:s=>{const m=s.match(/A室(..)・B室(..)/);return[m[1],m[2]].sort().join(' と ')},
 f:'₄C₂ ÷ 2! = 6 ÷ 2 = 3',w:'部屋に名前があれば6通り。名前を消すと「A室AB・B室CD」と「A室CD・B室AB」は同じ分け方。人数が同じ組が2つあるから 2! で割る。人数が違う組(3人と1人など)は人数で区別がつくので割らない。'},
{n:'A, B, C, D を並べる。A は B より左(順序固定)',make:()=>permsR([...'ABCD'],4).map(p=>p.join('')),key:s=>s.replace(/[AB]/g,'○'),valid:s=>s.indexOf('A')<s.indexOf('B'),
 f:'4! ÷ 2! = 12',w:'A, B を同じ文字 ○ とみなすと、1つの束に「A が左」「B が左」の2個が入る。条件に合うのは各束に1個だけ(色つき)。だから束の数がそのまま答え。'}
];
const sw=(t,x,y)=>t.split(x).join('\u0000').split(y).join(x).split('\u0000').join(y);
const OPS=[
 [{n:'2人の順番を入れかえる',f:t=>t[1]+t[0]}],
 [{n:'左の2人を入れかえる',f:t=>t[1]+t[0]+t[2]},{n:'右の2人を入れかえる',f:t=>t[0]+t[2]+t[1]}],

function drillList(){
 const n=D.filter(d=>S.done[d.id]).length;
 let h=`<div class="card"><h2>問題集を樹形図で確かめる</h2><div class="sub">問題集の赤チェックの問題を、<b>7つの考え方</b>ごとに並べた。どの問題も、この7つのどれか(または組み合わせ)で解ける。「初見」タブで選ぶのも、この7つ。</div><div class="score">${n} / ${D.length} 完了</div></div>`;
 T.forEach((t,k)=>{const ds=D.map((d,i)=>[d,i]).filter(x=>DTP[x[0].id][0]===k);if(!ds.length)return;
  h+=`<div class="card" style="margin-bottom:4px"><h2><span class="sw" style="background:${TC[k]}"></span>${k+1}. ${t}</h2><div class="sub">${TD[k].d}</div></div>`+
  ds.map(([d,i])=>`<button class="item" style="margin:4px 0 4px 14px;width:calc(100% - 14px)" data-drill="${i}">${S.done[d.id]?'<span class="done">✓</span>':''}<b>${d.ref}</b>${DTP[d.id][1]!==undefined?` <span class="tag">＋ ${T[DTP[d.id][1]]}</span>`:''}<br><span class="sub">${esc(d.t)}</span></button>`).join('')});
 return h;
}
function openDrill(i){S.drill={i,step:0,ord:D[i].s.map(s=>shuffle([0,1,2])),ng:{}}}

 const fig=()=>{if(!sp)return'';const N=sp.cols.length,L=Math.ceil(N*Math.min(st.step,ns)/ns),pv=Math.ceil(N*Math.max(0,st.step-1)/ns),tc=treeCard(sp,L,!!fa.ok&&L>pv);
  return `<div class="frac ${fa.ok?'':''}" style="margin:14px 0"><div class="sub"><b>樹形図</b>${sp.cap?' '+sp.cap:''}</div>${tc.html}${L?'':'<div class="sub">ステップに答えると、樹形図が1列ずつ伸び、絵も1つずつ埋まっていく。</div>'}</div>`};
 const tp=DTP[d.id],tg=tp.map(k=>`<span class="tag" style="font-size:11px;background:${TC[k]};color:#fff;border-radius:6px;padding:2px 8px;margin-right:4px">${T[k]}</span>`).join('');
 let h=back('drill')+`<div class="card"><b>${d.ref}</b><div style="margin-top:6px">${esc(d.t)}</div>${d.fig?fig73():''}<div style="margin-top:8px"><span class="sub">使う考え方 </span>${tg}</div></div><div class="card">`;
 d.s.forEach((s,k)=>{
  if(k>st.step)return;
  const solved=k<st.step,nw=fa.ok&&k===st.step?'fxin':'',nd=nw?'animation-delay:.35s':'';
  if(!solved)h+=fig();
  h+=`<div class="stepn ${nw}" style="${nd}">STEP ${k+1}</div><div class="${nw}" style="${nd}"><b>${esc(s.q)}</b></div>`;
  st.ord[k].forEach(j=>{
   const cls=solved&&j===0?'ok':(st.ng[k+'_'+j]?'ng':''),fx=fa.k===k?(fa.ok&&j===0?'fxpulse':(!fa.ok&&j===fa.j?'fxshake':'')):nw;
   h+=`<button class="opt ${cls} ${fx}" style="${fx===nw?nd:''}" data-ans="${k}_${j}" ${solved?'disabled':''}>${esc(s.o[j])}</button>`;
  });
  if(solved)h+=`<div class="why ${fa.ok&&fa.k===k?'fxin':''}" style="animation-delay:.15s">${esc(s.w)}</div>`;
  else if(Object.keys(st.ng).some(x=>x.startsWith(k+'_')))h+=`<div class="sub">もう一度。上の樹形図で、線の本数を数えてみよう。</div>`;
 });
 if(st.step>=ns){
  h+=fig()+`<div class="say ${fa.ok?'fxpulse':''}"><b>答え:${esc(d.f)}</b></div><div class="why ${fa.ok?'fxin':''}" style="animation-delay:.3s"><b>この問題で使った考え方</b>${tp.map(k=>`<div style="margin-top:6px"><span class="sw" style="background:${TC[k]}"></span><b>${T[k]}</b><br><span class="sub">${TD[k].d}</span></div>`).join('')}</div><div class="row">${lk?`<button class="btn" data-golab="${lk[0]}:${lk[1]}">${lk[2]}</button>`:''}${st.i+1<D.length?`<button class="btn pri" data-drill="${st.i+1}">次の問題へ</button>`:''}<button class="btn" data-back="drill">一覧へ</button></div>`;
 }
 return h+'</div>';
}

/* ---------- 初見の一手 ---------- */
const Q=[
{t:'0〜5 の6個の数字から異なる4個を使って、4桁の奇数を作る。',a:0,e:'一の位(1, 3, 5 の3通り)→ 千の位(0と一の位以外の4通り)→ 残り ₄P₂ = 12。3 × 4 × 12 = 144 個。'},
{t:'大人3人と子ども4人が1列に並ぶ。大人3人が隣り合う。',a:2,e:'大人3人を1つにまとめて 5! 通り。中の並び 3!。120 × 6 = 720 通り。'},
{t:'大人3人と子ども4人が1列に並ぶ。大人どうしが隣り合わない。',a:3,e:'子ども4人を先に並べ 4!。すきま5か所から3か所に大人 ₅P₃ = 60。24 × 60 = 1440 通り。'},
{t:'6人から3人の係を選ぶ。A, B の少なくとも一方が選ばれる。',a:4,e:'全体 ₆C₃ = 20。A も B も選ばれないのは残り4人から3人で 4。20 − 4 = 16 通り。'},
{t:'9人を3人ずつの3組に分ける。',a:5,e:'₉C₃ × ₆C₃ = 1680 は組に名前がある場合。同じ人数の3組なので 3! で割って 280 通り。'},
{t:'SUCCESS の7文字を1列に並べる。',a:5,e:'S が3個、C が2個。7! ÷ (3! × 2!) = 420 通り。'},
{t:'碁盤の目の道を、右に5区画・上に3区画進む最短経路。',a:6,e:'→ 5個と ↑ 3個の並べ方。8か所から ↑ の3か所を選び ₈C₃ = 56 通り。'},
{t:'同じ鉛筆6本を3人に配る(もらえない人がいてもよい)。',a:6,e:'○ 6個と仕切り2本の並べ方。₈C₂ = 28 通り。'},
{t:'1〜5 から異なる3個を使って3桁の整数を作る。320 より大きいもの。',a:1,e:'百の位4, 5:2 × ₄P₂ = 24。百の位3:十の位4, 5 で 2 × 3 = 6、十の位2で 321, 324, 325 の3。合計 33 個。'},
{t:'6人が円卓に座る。A と B が向かい合う。',a:0,e:'A を固定すると B の席は向かいの1通りに決まる。残り4人は 4! = 24 通り。'},
{t:'x + y + z = 10 を満たす正の整数の組 (x, y, z)。',a:6,e:'先に1ずつ配り、残り7を分ける。○ 7個と仕切り2本で ₉C₂ = 36 個。'},
{t:'A, B, C, D, E の5人が1列に並ぶ。A は B より左にいる。',a:5,e:'A, B を同じ ○ とみなす。5! ÷ 2! = 60 通り。「A が左」と「B が左」は同じ数ずつある、と見てもよい。'},
{t:'大・中・小3個のさいころを投げる。少なくとも1個は6の目が出る。',a:4,e:'全体 6³ = 216。6が1個も出ないのは 5³ = 125。216 − 125 = 91 通り。'},
{t:'赤玉3個、白玉2個、青玉1個を1列に並べる。',a:5,e:'6! ÷ (3! × 2!) = 60 通り。'},
{t:'男子3人と女子3人が、男女交互に1列に並ぶ。',a:1,e:'「男女男女男女」と「女男女男女男」の2つの型に分ける。それぞれ 3! × 3! = 36。合計 72 通り。'},
{t:'正八角形の対角線の本数。',a:4,e:'頂点2個の選び方 ₈C₂ = 28 から、辺になる8本を引いて 20 本。'},
{t:'5個の数字 0, 1, 2, 3, 4 から異なる3個を使う3桁の整数のうち、5の倍数。',a:0,e:'5の倍数になるには一の位が0(5は無い)。一の位を0に決めると百の位4通り、十の位3通りで 12 個。'},
{t:'りんご・なし・もも から合わせて5個買う(買わない種類があってもよい)。',a:6,e:'○ 5個と仕切り2本。₇C₂ = 21 通り。'},
{t:'8人を、4人・2人・2人の3組に分ける。',a:5,e:'₈C₄ × ₄C₂ = 420。2人の組が2つで区別がつかないので 2! で割って 210 通り。'},
{t:'a, b, c, d, e, f の6文字を並べる。a と b が隣り合わない。',a:4,e:'全体 6! = 720 から、隣り合う 5! × 2 = 240 を引いて 480 通り。すきまで数えても 4! × ₅P₂ = 480。'}
];
function newQuiz(){const last=S.quiz?S.quiz.i:-1;let i;do{i=Math.floor(Math.random()*Q.length)}while(i===last);S.quiz={i,pick:null,L:0,ng:{},dv:false,opts:null}}
function qNext(){const z=S.quiz,sp=spOf('q'+z.i,QS[z.i]),N=sp.cols.length;if(z.L>=N)return null;const r=tBuild(sp,z.L+1),cs=tLevel(r,z.L+1);if(cs.length!==1)return{uni:false};
 let n=r;while(n.d<z.L)n=n.ch[0];const ft=n.ch[0].m>1,v=cs[0],set=new Set([v]);(ft?[v*2,Math.round(v/2)||v+3,v+10]:[v+1,v>2?v-1:v+2,v+3]).forEach(x=>{if(set.size<3&&x>0)set.add(x)});
 if(!z.opts||z.opts.L!==z.L)z.opts={L:z.L,o:shuffle([...set])};return{uni:true,ft,v,l:n.ch[0].v,o:z.opts.o}}
function quizView(){
 if(!S.quiz)newQuiz();
 const z=S.quiz,q=Q[z.i],p=z.pick,sp=spOf('q'+z.i,QS[z.i]),N=sp.cols.length;
 let h=`<div class="card"><h2>初見の一手</h2><div class="sub">まず「最初にどの考え方を使うか」を、7つの中から決める。そのあと、樹形図を1列ずつ描きながら答えまで進む。<br>7つの考え方は「確認」タブの問題で1つずつ使ったもの。</div><div class="row" style="margin-top:6px"><button class="btn sm" data-tab="drill">「確認」で7つの考え方を見る</button></div><div class="score">一手目の正解 ${S.qs.ok} / ${S.qs.n} 問</div></div>
 <div class="card"><div style="font-size:17px"><b>${esc(q.t)}</b></div><div style="margin-top:10px">`;
 T.forEach((t,j)=>{if(p!==null&&j!==q.a&&j!==p)return;const cls=p===null?'':(j===q.a?'ok':(j===p?'ng':'')),fx=FX.qa&&p!==null?(j===q.a?'fxpulse':(j===p?'fxshake':'')):'';h+=`<button class="opt ${cls} ${fx}" data-qa="${j}" ${p===null?'':'disabled'}><span class="sw" style="background:${TC[j]}"></span><b>${t}</b><br><span class="sub" style="margin-left:20px">${TD[j].cue}</span></button>`});
 h+='</div>';
 if(p===null)return h+'</div>';
 h+=`<div class="why ${FX.qa?'fxin':''}" style="animation-delay:.2s"><b>${p===q.a?'正解。':'一手目は「'+T[q.a]+'」。'}</b><br><span class="sub">${TD[q.a].d}</span><br>では、樹形図で最後まで数える。</div></div>`;
 const tc=treeCard(sp,z.L,!!FX.qc),nx=qNext(),fin=tc.done&&(!sp.div||z.dv),ans=tc.done?tc.tot/(sp.div?sp.div.by:1):0;
 h+=`<div class="card ${FX.qa?'fxin':''}" style="${FX.qa?'animation-delay:.4s':''}"><h3 style="margin-top:0">樹形図${sp.cap?`<span class="sub" style="font-weight:400"> ${sp.cap}</span>`:''}</h3>${tc.html}${z.L?'':'<div class="sub">下の問いに答えると、樹形図が1列ずつ伸び、絵も1つずつ埋まっていく。</div>'}`;
 if(nx){const nm=sp.cols[z.L],dl=FX.qc?`animation-delay:${(tc.T+.3).toFixed(2)}s`:'',fc=FX.qc?'kfade':'';
  if(nx.uni){h+=`<div class="stepn ${fc}" style="${dl}">${z.L+1}列目</div><div class="${fc}" style="${dl}"><b>${nx.ft?`「${nm}」は、1本の太い線にまとめて描く。${nx.l} はいくつか。`:z.L?`「${nm}」の列。○ 1つから、線は何本出るか。`:`最初の列は「${nm}」。スタートから線は何本出るか。`}</b></div>`+
   nx.o.map(v=>`<button class="opt ${z.ng[z.L+'_'+v]?'ng':''} ${FX.qng===v?'fxshake':fc}" style="${FX.qng===v?'':dl}" data-qc="${v}">${v}${nx.ft?' 通り':' 本'}</button>`).join('')}
  else h+=`<div class="stepn ${fc}" style="${dl}">${z.L+1}列目</div><div class="${fc}" style="${dl}"><b>「${nm}」の列は、○ によって出る線の本数がちがう。</b></div><button class="opt ${fc}" style="${dl}" data-qc="go">描いて確かめる</button>`}
 else if(sp.div&&!z.dv){const dv=sp.div,o=[dv.by,dv.by*2,dv.by+1];
  h+=`<div class="stepn">重なり</div><div><b>${dv.why}</b></div><div class="flat" style="margin:8px 0">${dv.toks.map((t,i)=>`<span class="tok v fxin" style="animation-delay:${i*.15}s">${t}</span>`).join('')}</div><div><b>${tc.tot} を、いくつで割ればよいか。</b></div>`+
   o.map(v=>`<button class="opt ${z.ng['d_'+v]?'ng':''} ${FX.qng===v?'fxshake':''}" data-qd="${v}">${v} で割る</button>`).join('')}
 h+='</div>';
 if(fin)h+=`<div class="card ${FX.qc||FX.qd?'fxin':''}" style="${FX.qc?`animation-delay:${(tc.T+1.2).toFixed(2)}s`:''}"><div class="say ${FX.qd?'fxpulse':''}" style="margin-top:0"><b>答え:${sp.div?`${tc.tot} ÷ ${sp.div.by} = `:''}${ans} 通り</b>${sp.note?'<br>'+sp.note:''}</div>
 <div class="why">${esc(q.e)}</div><div class="row"><button class="btn pri" data-qn="1">次の問題</button></div></div>`;
 return h;
}

/* ---------- 描画とイベント ---------- */
function render(){
 let h;
 if(S.tab==='cnt')h=G.i===null?kMenu():kView();
 else if(S.tab==='lab')h=S.lab==='perm'?labPerm():S.lab==='bund'?labBund():S.lab==='path'?labPath():S.lab==='bars'?labBars():labMenu();
 else if(S.tab==='drill')h=S.drill?drillView():drillList();
 else h=quizView();
 app.innerHTML=h;
 if(FX.nav&&app.children)[...app.children].forEach((c,i)=>{c.classList.add('fxin');c.style.animationDelay=(i*45)+'ms'});
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
 if(G.cnt){G.cnt=false;const el=$('#kc'),N=G.all.length,t0=performance.now()+G.T*1000,D=1400;if(el){el.textContent='0';(function tick(now){if(!el.isConnected)return;const r=Math.min(1,Math.max(0,(now-t0)/D));el.textContent=Math.round(r*N);if(r<1)requestAnimationFrame(tick)})(performance.now())}}
 const sel=$('#bsel');if(sel)sel.onchange=()=>{L.bund.i=+sel.value;L.bund.g=false;L.bund.orb=null;L.bund.dup=false;L.bund.auto=false;render()};
 FX={};
}
document.addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(!b)return;const d=b.dataset;let top=false;if(!d.kbest)G.play=null;if(!d.bauto)L.bund.auto=false;
 if(d.tab){S.tab=d.tab;if(d.tab==='drill')S.drill=null;if(d.tab==='cnt')G.i=null;top=true}
 else if(d.lab){S.lab=d.lab;if(d.lab==='path')L.path.intro=true;top=true}
 else if(d.back){if(d.back==='lab')S.lab=null;else if(d.back==='cnt')G.i=null;else S.drill=null;top=true}
 else if(d.kopen!==undefined){kOpen(+d.kopen);top=true}
 else if(d.ko!==undefined){G.ord.push(+d.ko);G.anim=true}
 else if(d.kbest){G.ord=[];G.play=kBest(G.i).ord.slice();render();window.scrollTo(0,0);setTimeout(kPlay,500);return}
 else if(d.kundo){G.ord.pop()}
 else if(d.bop!==undefined){const s=L.bund,x=BP[s.i].ops[+d.bop].f(s.cur);s.dup=s.orb.includes(x);s.cur=x;if(!s.dup)s.orb.push(x);FX.bop=+d.bop}
 else if(d.bauto){L.bund.auto=true;bAuto();return}
 else if(d.pick!==undefined){L.perm.ch.push(+d.pick)}
 else if(d.pn){const s=L.perm;s.n=Math.max(3,Math.min(6,s.n+ +d.pn));s.r=Math.min(s.r,s.n);s.ch=[]}
 else if(d.pr){const s=L.perm;s.r=Math.max(1,Math.min(s.n,s.r+ +d.pr));s.ch=[]}
 else if(d.preset){L.perm.ch=[]}
 else if(d.bg){L.bund.g=!L.bund.g;FX.bg=1}
 else if(d.mv){const s=L.path;if(d.mv==='u')s.m.pop();else if(d.mv==='r'){s.m=shuffle(Array(s.w).fill('→').concat(Array(s.h).fill('↑')))}else s.m.push(d.mv);FX.mv=d.mv==='r'?'all':d.mv==='u'?null:'last'}
 else if(d.pintro){L.path.intro=d.pintro==='1';top=true}
 else if(d.g73){const s=L.path;s.w=7;s.h=5;s.m=[];s.q73=true}
 else if(d.gw){const s=L.path;s.w=Math.max(2,Math.min(7,s.w+ +d.gw));s.m=[];s.q73=false}
 else if(d.gh){const s=L.path;s.h=Math.max(1,Math.min(5,s.h+ +d.gh));s.m=[];s.q73=false}
 else if(d.cell!==undefined){const s=L.bars,i=+d.cell,k=s.b.indexOf(i);if(k>=0)s.b.splice(k,1);else{if(s.b.length>=2)s.b.shift();s.b.push(i);FX.cell=i}}
 else if(d.br!==undefined){const s=L.bars,n=(s.min1?7:10)+2;s.b=d.br==='1'?shuffle([...Array(n).keys()]).slice(0,2):[];FX.cellAll=1}
 else if(d.bm){L.bars.min1=!L.bars.min1;L.bars.b=[]}
 else if(d.drill!==undefined){openDrill(+d.drill);top=true}
 else if(d.ans){const[k,j]=d.ans.split('_').map(Number),st=S.drill;if(k!==st.step)return;
  FX.ans={k,j,ok:j===0};if(j===0){st.step++;if(st.step>=D[st.i].s.length){S.done[D[st.i].id]=1;store.set('done',S.done)}}else st.ng[k+'_'+j]=1}
 else if(d.qc!==undefined){const z=S.quiz,nx=qNext();if(!nx)return;if(d.qc==='go'||+d.qc===nx.v){z.L++;z.ng={};FX.qc=1}else{z.ng[z.L+'_'+d.qc]=1;FX.qng=+d.qc}}
 else if(d.qd!==undefined){const z=S.quiz,sp=spOf('q'+z.i,QS[z.i]);if(+d.qd===sp.div.by){z.dv=true;FX.qd=1}else{z.ng['d_'+d.qd]=1;FX.qng=+d.qd}}
 else if(d.golab){const[lb,i]=d.golab.split(':');S.tab='lab';S.lab=lb;if(lb==='bund'){L.bund.i=+i;L.bund.orb=null;L.bund.g=false}if(lb==='path'){const s=L.path;s.intro=false;s.w=7;s.h=5;s.m=[];s.q73=true}top=true}
 else if(d.qa!==undefined){if(S.quiz.pick!==null)return;S.quiz.pick=+d.qa;FX.qa=1;S.qs.n++;if(+d.qa===Q[S.quiz.i].a)S.qs.ok++;store.set('qs',S.qs)}
 else if(d.qn){newQuiz();top=true}
 else return;
 if(top)FX.nav=1;render();if(top)window.scrollTo(0,0);
});
render();
